<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shrishtiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background subtle rounded base -->
  <rect width="100" height="100" rx="26" fill="#0B0F19" />
  <rect width="100" height="100" rx="26" stroke="url(#shrishtiGlow)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Outer orbit ring -->
  <circle cx="50" cy="50" r="32" stroke="url(#shrishtiGlow)" stroke-width="2.5" stroke-dasharray="8 4" stroke-opacity="0.8" />
  
  <!-- Needle diamond core -->
  <path d="M50 18 L64 50 L50 82 L36 50 Z" fill="url(#shrishtiGlow)" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Horizontal needle cross -->
  <path d="M22 50 L50 44 L78 50 L50 56 Z" fill="#38BDF8" opacity="0.85"/>
  
  <!-- Center beacon spark -->
  <circle cx="50" cy="50" r="4.5" fill="#FFFFFF" />
  <circle cx="50" cy="50" r="7" stroke="#38BDF8" stroke-width="1.5" />
</svg>

